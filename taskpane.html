<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standpoint</title>

<!--
  Office.js from Microsoft's CDN — the one external script an Office add-in is
  expected to load, and how the pane talks to Word at all. Loaded WITHOUT
  async/defer: Office.onReady must be callable by the time taskpane.js runs.
-->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<style>
  /* The app's own palette (src/index.css), so the pane is recognisably
     Standpoint sitting beside a white document. */
  :root {
    --bg: #0C1417; --panel: #101A1E; --card: #152227; --card-hover: #1A2C32;
    --line: #20343B; --line-soft: #1A2A30;
    --ink: #E9F1F2; --ink-mid: #A7BBC0; --ink-dim: #728A91;
    --supports: #38B2A3; --contradicts: #E19542; --ambiguous: #7C919A;
    --warn: #E4C05A; --lit: #6FA8C7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px 12px 24px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  /* ── header ─────────────────────────────────────────────────────────── */
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  h1 { font-size: 13px; margin: 0; letter-spacing: .01em; font-weight: 600; }
  .sub { color: var(--ink-dim); font-size: 11px; margin: 0 0 10px; }

  textarea {
    font: inherit; font-size: 12.5px; color: var(--ink); width: 100%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px; resize: vertical; line-height: 1.45;
  }
  label.field em { font-style: normal; color: var(--warn); }

  select, input[type=text] {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 7px; width: 100%;
  }
  label.field { display: block; margin-bottom: 8px; }
  label.field > span { display: block; color: var(--ink-dim); font-size: 11px;
                       margin-bottom: 3px; }

  button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--card-hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { border-color: #2C4A53; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  .toggle { display: flex; align-items: center; gap: 6px;
            color: var(--ink-mid); font-size: 11.5px; cursor: pointer; }

  /* ── the one-line state ─────────────────────────────────────────────── */
  .state {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 9px 11px; margin: 10px 0;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); font-size: 12.5px; line-height: 1.4;
  }
  .state::before { content: "●"; font-size: 10px; line-height: 1.6; }
  .state--ok   { color: var(--supports); }
  .state--bad  { color: var(--contradicts); }
  .state--wait { color: var(--ink-dim); }
  .state--warn { color: var(--warn); }
  .state b { font-weight: 600; }
  .state .act { margin-top: 6px; }

  /* progress, for the indexing state */
  .bar { height: 3px; background: var(--line-soft); border-radius: 2px;
         margin-top: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--supports); }

  /* ── cards ──────────────────────────────────────────────────────────── */
  .group { border: 1px solid var(--line); border-radius: 6px;
           background: var(--panel); margin-bottom: 9px; overflow: hidden; }
  .group-head { padding: 8px 10px 6px; border-bottom: 1px solid var(--line-soft); }
  .ptitle { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .pmeta { color: var(--ink-dim); font-size: 11px; margin-top: 2px; }

  .card { padding: 8px 10px; border-top: 1px solid var(--line-soft); }
  .card:first-of-type { border-top: 0; }
  .passage { font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .passage.weak { color: var(--ink-mid); }

  .chip { display: inline-block; font-size: 10.5px; padding: 1px 6px;
          border-radius: 9px; border: 1px solid; margin-bottom: 5px; }
  .chip--supports    { color: var(--supports);    border-color: #22584F; }
  .chip--contradicts { color: var(--contradicts); border-color: #6B4A20; }
  .chip--ambiguous   { color: var(--ambiguous);   border-color: #3A464B; }
  .chip--not_relevant{ color: var(--ink-dim);     border-color: var(--line); }
  .chip--none        { color: var(--ink-dim);     border-color: var(--line);
                       border-style: dashed; }

  button.inline-more { border: 0; background: none; padding: 0; color: var(--lit);
                       font-size: 12px; text-decoration: underline; cursor: pointer; }
  button.inline-more:hover { background: none; color: var(--ink); }

  .flag { color: var(--warn); font-size: 11px; margin-top: 5px; }
  .acts { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button { font-size: 11px; padding: 3px 8px; }
  .more { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line-soft);
          border-radius: 0; color: var(--ink-mid); font-size: 11.5px; padding: 7px 10px; }

  /* ── literature ─────────────────────────────────────────────────────── */
  details.lit { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.lit > summary { color: var(--lit); font-size: 12px; cursor: pointer; }
  .note { color: var(--ink-dim); font-size: 11px; margin: 6px 0; line-height: 1.45; }
  .lit-result { border: 1px solid var(--line); border-radius: 6px;
                background: var(--panel); padding: 8px 10px; margin-bottom: 7px; }

  .hint { color: var(--ink-dim); font-size: 11px; margin: 8px 0 0; }
  details.diag { margin-top: 16px; }
  details.diag > summary { color: var(--ink-dim); font-size: 11px; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-word; color: var(--ink-dim);
        font: 11px/1.4 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>

<div class="top"><h1>Standpoint</h1></div>
<p class="sub">Reads your selection. Never writes to your document.</p>

<label class="field">
  <span>Searching against</span>
  <select id="standpoint"></select>
</label>

<!-- BROWSER TEST MODE. Hidden inside Word, where the document IS the input.
     Shown when Office.js reports no host, so the whole pane — search, cards,
     every state — can be exercised in an ordinary browser with devtools, on a
     machine that has no Word at all. -->
<div id="browser-mode" hidden>
  <label class="field">
    <span>Sentence to search for <em>(browser test mode — no Word host)</em></span>
    <textarea id="browser-text" rows="3"
      placeholder="Type or paste a sentence, as if you were drafting it in Word…"></textarea>
  </label>
</div>

<div class="row">
  <button id="find" class="primary">Find evidence</button>
  <label class="toggle">
    <input type="checkbox" id="live" checked>
    <span>Live hints</span>
  </label>
</div>

<div id="state" class="state state--wait">Checking…</div>

<div id="results"></div>

<details class="lit" id="lit-wrap">
  <summary>Search for new papers</summary>
  <div id="lit"></div>
</details>

<details class="diag">
  <summary>Diagnostics</summary>
  <!-- Every pane state, reachable on demand. States nobody can look at are
       states nobody checks: "indexing 46%" and "needs a newer Standpoint"
       otherwise require contriving the conditions that produce them. -->
  <div class="row" id="state-switch"></div>
  <pre id="diag"></pre>
</details>

<script src="taskpane.js"></script>
</body>
</html>
